<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> wepstor_2</title>
    <style>
        /* إضافة بعض التنسيقات البسيطة لجعل المتجر يبدو مرتباً */
        body { font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f4f4; }
   
    
        header { background-color: #333; 
            color: white; padding: 1rem; 
            text-align: center; }
   
    
        nav { display: flex; 
            justify-content: center; 
            background: #444; 
            padding: 10px; }
    
    
        nav a { color: white; 
            margin: 0 15px; 
            text-decoration: none; }
    
    
        .container { padding: 20px; 
            display: flex; flex-wrap: wrap; 
            justify-content: center; }
    
    
        .product-card { background: white;
            border: 1px solid #ddd; 
            margin: 10px;
            padding: 15px; 
            width: 250px; 
            text-align: center; 
            border-radius: 8px; }
    
    
        .product-card img { max-width: 100%; 
            height: auto; 
            border-radius: 5px; }
    
    
        .price { color: green; 
            font-weight: bold; 
            font-size: 1.2rem; }
    
    
        button { background-color: #28a745; 
            color: white;
            border: none; 
            padding: 10px 15px; 
            border-radius: 5px; 
            cursor: pointer; }
    
    
        button:hover { background-color: #218838; }
        footer { background: #333; 
            color: white; 
            text-align: center; 
            padding: 10px; 
            position: fixed; 
            bottom: 0; 
            width: 100%; }
    </style>
</head>
<body>

    <header>
        <h1>مرحباً بكم في متجرنا</h1>
    </header>

    <nav>
        <a href="#">الرئيسية</a>
        <a href="#">المنتجات</a>
        <a href="#">من نحن</a>
        <a href="#">اتصل بنا</a>
    </nav>

    <div class="container">
        
        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="منتج 1">
            <h3>هاتف ذكي حديث</h3>
            <p>وصف مختصر للمنتج ومميزاته الرائعة.</p>
            <p class="price">2500 درهم</p>
            <button>إضافة إلى السلة</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="منتج 2">
            <h3>ساعة ذكية</h3>
            <p>تتبع نشاطك الرياضي وصحتك بكل سهولة.</p>
            <p class="price">450 درهم</p>
            <button>إضافة إلى السلة</button>
        </div>

        <div class="product-card">
            <img src="images/momen.jpg">
            <h3>سماعات لاسلكية</h3>
            <p>جودة صوت عالية وتصميم مريح للأذن.</p>
            <p class="price">300 درهم</p>
            <button>إضافة إلى السلة</button>
        </div>

    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 متجري الإلكتروني</p>
    </footer>

</body>
</html>
