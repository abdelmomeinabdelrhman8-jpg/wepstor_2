
    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <style>
        /* تنسيقات عامة */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        /* رأس الصفحة */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* حاوية المنتجات */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        /* بطاقة المنتج */
        .product-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 15px;
            width: 250px;
            overflow: hidden;
            transition: transform 0.3s;
            text-align: center;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 1.2em;
            margin: 10px 0;
            color: #333;
        }

        .price {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        /* زر الشراء */
        .btn-buy {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-buy:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

<header>
    <h1>مرحباً بكم في متجري</h1>
    <p>أفضل المنتجات بأقل الأسعار</p>
</header>

<div class="container">
    <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="اسم المنتج">
        <div class="product-info">
            <h2 class="product-title">اسم المنتج الأول</h2>
            <p class="price">150 درهم</p>
            <button class="btn-buy">أضف إلى السلة</button>
        </div>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="اسم المنتج">
        <div class="product-info">
            <h2 class="product-title">اسم المنتج الثاني</h2>
            <p class="price">200 درهم</p>
            <button class="btn-buy">أضف إلى السلة</button>
        </div>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="اسم المنتج">
        <div class="product-info">
            <h2 class="product-title">اسم المنتج الثالث</h2>
            <p class="price">350 درهم</p>
            <button class="btn-buy">أضف إلى السلة</button>
        </div>
    </div>
</div>

</body>
</html>
